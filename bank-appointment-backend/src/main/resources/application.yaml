quarkus:
  http:
    port: "${HTTP_PORT:8080}"
    cors:
      ~: true
      origins: "${CORS_ORIGINS:http://localhost:4200}"
      methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
      headers: "Accept,Authorization,Content-Type,X-Idempotency-Key"
      exposed-headers: "Location"
      access-control-max-age: "24H"
      access-control-allow-credentials: false
    limits:
      max-body-size: "64K"
    auth:
      permission:
        public-auth:
          paths: "/api/v1/auth/*"
          policy: "permit"
          methods: "GET,POST,OPTIONS"
  oidc:
    application-type: "service"
    roles:
      role-claim-path: "roles"
  datasource:
    db-kind: "postgresql"
  hibernate-orm:
    database:
      default-schema: "booking"
      generation: "validate"
    log:
      sql: false
  flyway:
    migrate-at-start: true
    default-schema: "booking"
    schemas: "booking"
    create-schemas: true
    baseline-on-migrate: true
    baseline-version: "0"
    locations: "classpath:db/migration"
  jackson:
    write-dates-as-timestamps: false
  smallrye-openapi:
    info-title: "Capitec Booking Backend API"
    info-version: "1.0.0"
    info-description: "Backend API for branch appointment search, slot availability and booking confirmation."
  micrometer:
    export:
      prometheus:
        enabled: true
  mailer:
    mock: false
  rest-client:
    fusionauth:
      url: "${app.fusionauth.base-url}"
      connect-timeout: 10000
      read-timeout: 15000

