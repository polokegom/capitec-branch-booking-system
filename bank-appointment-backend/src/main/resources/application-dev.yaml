quarkus:
  http:
    cors:
      origins: "${CORS_ORIGINS:http://localhost:4200}"
  oidc:
    auth-server-url: "${OIDC_AUTH_SERVER_URL:http://localhost:9011}"
    client-id: "${OIDC_CLIENT_ID:85a03867-dccf-4882-adde-1a79aeec50df}"
    token:
      audience: "${OIDC_TOKEN_AUDIENCE:85a03867-dccf-4882-adde-1a79aeec50df}"
      issuer: "${OIDC_TOKEN_ISSUER:http://localhost:9011}"
  datasource:
    username: "${DB_USERNAME:booking_user}"
    password: "${DB_PASSWORD:booking_pass}"
    jdbc:
      url: "${DB_JDBC_URL:jdbc:postgresql://localhost:5432/booking_service}"
      min-size: "${DB_JDBC_MIN_SIZE:1}"
      max-size: "${DB_JDBC_MAX_SIZE:8}"
    reactive:
      url: "${DB_REACTIVE_URL:postgresql://localhost:5432/booking_service}"
      max-size: "${DB_POOL_MAX_SIZE:60}"
      postgresql:
        ssl-mode: "${DB_REACTIVE_SSL_MODE:disable}"
      trust-certificate-pem:
        ~: false
  mailer:
    from: "${MAIL_FROM:no-reply@capitec-booking.co.za}"
    host: "${MAIL_HOST:localhost}"
    port: "${MAIL_PORT:1026}"
    start-tls: "DISABLED"
    login: "DISABLED"
    auth-methods: "PLAIN"

app:
  fusionauth:
    base-url: "${FUSIONAUTH_BASE_URL:http://localhost:9011}"
    api-key: "${FUSIONAUTH_API_KEY:bf69486b-4733-4470-a592-f1bfce7af580}"
    application-id: "${FUSIONAUTH_APPLICATION_ID:85a03867-dccf-4882-adde-1a79aeec50df}"
    tenant-id: "${FUSIONAUTH_TENANT_ID:30663132-6464-6665-3032-326466613934}"
  public-base-url: "${PUBLIC_BASE_URL:http://localhost:4200}"
  email-assets:
    base-url: "${EMAIL_ASSETS_BASE_URL:https://capitec-booking-prod-597088041287-email-assets.s3.af-south-1.amazonaws.com}"
  mail:
    ses:
      configuration-set: "${MAIL_SES_CONFIGURATION_SET:}"
  security:
    owner-email: "${OWNER_EMAIL:owner.lerato@gmail.co.za}"
    bootstrap-owner: "${OWNER_BOOTSTRAP:true}"
