worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format json escape=json
    '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
    '"uri":"$request_uri","status":$status,"size":$body_bytes_sent,'
    '"referer":"$http_referer","ua":"$http_user_agent","rt":$request_time}';
  access_log /dev/stdout json;
  error_log  /dev/stderr warn;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout 65;
  server_tokens   off;

  client_max_body_size 2m;

  gzip              on;
  gzip_comp_level   6;
  gzip_min_length   1024;
  gzip_proxied      any;
  gzip_vary         on;
  gzip_types        text/plain text/css text/javascript application/javascript application/json
                    application/xml application/xml+rss image/svg+xml font/woff font/woff2;

  include /etc/nginx/conf.d/*.conf;
}
